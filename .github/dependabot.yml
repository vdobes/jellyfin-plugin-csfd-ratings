version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Prague
    open-pull-requests-limit: 5
    labels: [dependencies, dotnet]
    commit-message:
      prefix: deps
    # Jellyfin 10.11 runs on .NET 9. Keep its shared Microsoft.Extensions
    # dependencies on the matching major to avoid runtime assembly conflicts.
    ignore:
      - dependency-name: Microsoft.Extensions.*
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci
