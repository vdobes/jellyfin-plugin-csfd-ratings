name: Bug report
description: Report reproducible incorrect behavior in the plugin.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Remove API keys, private URLs, media paths, and personal data from logs.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 1.0.1.0
    validations:
      required: true
  - type: input
    id: jellyfin-version
    attributes:
      label: Jellyfin version
      placeholder: 10.11.11
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation type
      options: [Docker, Linux package, Windows, macOS, Other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior, what you expected, and the smallest reproducible example.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the relevant redacted lines containing ČSFD.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed all secrets and private data.
          required: true
