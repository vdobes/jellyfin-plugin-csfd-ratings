# Sidecar pro Jellyfin ČSFD Ratings.
#
# node-csfd-api řeší Anubis proof-of-work i parsování ČSFD HTML, takže plugin
# jen volá JSON API. Verze je připnutá schválně - `latest` by ti mohlo pod rukama
# změnit tvar odpovědi.
#
# Služba ZÁMĚRNĚ nemá `ports:`. Bez volitelného API_KEY je to otevřená scrapovací proxy;
# kdyby byla dostupná zvenku, poteče provoz na ČSFD z tvojí IP a abuse report
# přijde tobě. Jellyfin ji vidí přes interní síť pod jménem služby.

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - media_net
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /path/to/media:/media:ro
    ports:
      - "8096:8096"

  csfd-api:
    image: bartholomej/node-csfd-api:5.11.0
    container_name: csfd-api
    restart: unless-stopped
    networks:
      - media_net
    # Žádné ports: - dostupné jen zevnitř media_net jako http://csfd-api:3000
    healthcheck:
      # 2294 = Vykoupení z věznice Shawshank. Stabilní záznam, vždy existuje.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/movie/2294"]
      interval: 5m
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  media_net:
    driver: bridge
